<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>WebXR Vehicle Builder - Quest 3S</title>
  <meta name="description" content="Ett fordonsskaparspel för Meta Quest 3S med WebXR">
  
  <!-- A-Frame och nödvändiga komponenter för fysik och VR-interaktion -->
  <script src="https://aframe.io"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
  </style>

  <script>
    // Enkel anpassad komponent för att fästa (snappa) delar till fordonschassit
    AFRAME.registerComponent('snap-build', {
      schema: {
        target: { type: 'selector', default: '#chassis' },
        snapDistance: { type: 'number', default: 0.4 }
      },
      init: function () {
        this.el.addEventListener('dragdrop', (evt) => {
          // När en del släpps nära chassit
          let chassisPos = this.data.target.object3D.position;
          let myPos = this.el.object3D.position;
          let distance = chassisPos.distanceTo(myPos);

          if (distance < this.data.snapDistance) {
            // Fäst komponenten till chassit visuellt och logiskt
            this.el.removeAttribute('dynamic-body');
            this.el.setAttribute('static-body', '');
            
            // Justera positionen så den hamnar snyggt (t.ex. på sidan av chassit)
            let relativeX = myPos.x > chassisPos.x ? 0.6 : -0.6;
            this.el.setAttribute('position', `${chassisPos.x + relativeX} ${chassisPos.y - 0.2} ${myPos.z}`);
            
            // Ändra färg för att indikera lyckad montering
            this.el.setAttribute('material', 'color', '#4CAF50');
            console.log("Del monterad på fordonet!");
          }
        });
      }
    });

    // Testfunktion för att "köra" fordonet när man trycker på en knapp
    AFRAME.registerComponent('vehicle-controller', {
      init: function () {
        this.el.addEventListener('click', () => {
          let chassis = document.querySelector('#chassis');
          // Ge chassit en knuff framåt i fysikmotorn
          chassis.setAttribute('dynamic-body', 'mass: 10');
          setTimeout(() => {
            let impulse = new CANNON.Vec3(0, 0, -15);
            let point = new CANNON.Vec3(0, 0, 0);
            chassis.body.applyImpulse(impulse, point);
          }, 100);
        });
      }
    });
  </script>
</head>
<body>

  <!-- Fysikmotorn konfigureras med stabil gravitation för VR -->
  <a-scene physics="debug: false; gravity: -9.8; friction: 0.1; restitution: 0.2">
    
    <!-- Resurser (Assets) -->
    <a-assets>
      <a-mixin id="cube" geometry="primitive: box; width: 0.3; height: 0.3; depth: 0.3"
               hoverable grabbable stretchable droppable
               event-set__hoveron="_event: hover-start; material.opacity: 0.7"
               event-set__hoveroff="_event: hover-end; material.opacity: 1"></a-mixin>
      <a-mixin id="wheel" geometry="primitive: cylinder; radius: 0.2; height: 0.1"
               rotation="0 0 90" hoverable grabbable droppable
               event-set__hoveron="_event: hover-start; material.wireframe: true"
               event-set__hoveroff="_event: hover-end; material.wireframe: false"></a-mixin>
    </a-assets>

    <!-- Miljö och golv -->
    <a-sky color="#ECEFF1"></a-sky>
    <a-grid id="ground" static-body geometry="primitive: plane; width: 100; height: 100" 
            material="color: #37474F; repeat: 100 100" rotation="-90 0 0"></a-grid>

    <!-- Byggbord / Arbetsbänk -->
    <a-box id="workbench" static-body position="0 0.6 -1" width="2" height="0.6" depth="1" material="color: #78909C">
      <!-- UI-Knapp för att testa fordonet -->
      <a-box id="start-button" vehicle-controller position="0 0.35 0.3" width="0.4" height="0.1" depth="0.2" material="color: #FF5722" class="clickable">
        <a-text value="KÖR" align="center" position="0 0.06 0" rotation="-90 0 0" width="1.5" color="#FFF"></a-text>
      </a-box>
    </a-box>

    <!-- FORDONSCHASSI (Basen som du ska bygga på) -->
    <a-box id="chassis" static-body position="0 0.75 -1" width="0.8; height: 0.15; depth: 1.4" material="color: #1E88E5" droppable>
      <a-text value="CHASSI" align="center" position="0 0.1 0" rotation="-90 0 0" width="2"></a-text>
    </a-box>

    <!-- BYGGDELAR (Hjul som ligger på bordet redo att monteras) -->
    <!-- Genom att dra dessa till chassit aktiveras snap-build komponenten -->
    
    
    
    

    <!-- Extra dekorationsblock/raketmotor -->
    

    <!-- VR-SPELARE OCH HANDKONTROLLER (Anpassat för Quest 3S) -->
    
      <a-camera position="0 1.6 0"></a-camera>
      
      <!-- Vänster handkontroll med laser och grepp-funktion -->
      
      
      <!-- Höger handkontroll med laser och grepp-funktion -->
      
    

  </a-scene>
</body>
</html>
